[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aseprite-gen"
version = "0.1.0"
description = "Reference-guided, layered pixel art through a real Aseprite MCP server"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<14", "numpy>=2,<3", "mcp>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]

[project.scripts]
aseprite-gen = "aseprite_gen.cli:main"
aseprite-gen-mcp = "aseprite_gen.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/aseprite-gen/profiles" = ["profiles/cozy-rpg.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an actual Aseprite executable"]
