name: Checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Unit and MCP transport checks
        run: python -m pytest -m "not integration" -q
      - name: Private sources must not be tracked
        run: python scripts/check_publication.py
